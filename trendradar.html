<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrendRadar — Tendencias Emergentes</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #05050a;
  --grid: rgba(255,255,255,.025);
  --surface: #0c0c15;
  --surface2: #12121e;
  --border: #1a1a2e;
  --border2: #252540;
  --text: #e8e8f0;
  --text2: #7070a0;
  --text3: #303050;
  --red: #ff3366;
  --orange: #ff6b35;
  --yellow: #ffd166;
  --green: #06ffa5;
  --cyan: #00d4ff;
  --purple: #7c6ef7;
  --mono: 'Space Mono', monospace;
  --sans: 'Familjen Grotesk', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--text);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 40px 40px;
}

/* ── Layout ── */
#app{display:flex;flex-direction:column;height:100vh}

/* ── Header ── */
header{
  display:flex;align-items:center;gap:16px;
  padding:14px 24px;
  border-bottom:1px solid var(--border);
  background:rgba(5,5,10,.9);
  backdrop-filter:blur(12px);
  flex-shrink:0;
  z-index:10;
}
.logo{
  font-family:var(--mono);
  font-size:16px;font-weight:700;
  color:var(--text);letter-spacing:-.02em;
}
.logo .slash{color:var(--red)}
.logo .radar-word{color:var(--cyan)}
.pulse-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--green);
  box-shadow:0 0 8px var(--green);
  animation:pulse-anim 2s ease-in-out infinite;
  flex-shrink:0;
}
@keyframes pulse-anim{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.live-label{font-family:var(--mono);font-size:10px;color:var(--green);letter-spacing:.1em}
.header-right{margin-left:auto;display:flex;align-items:center;gap:12px}
#last-update{font-family:var(--mono);font-size:10px;color:var(--text3)}
#refresh-btn{
  font-family:var(--mono);font-size:11px;
  padding:6px 14px;border-radius:4px;
  border:1px solid var(--border2);
  background:transparent;color:var(--text2);
  cursor:pointer;transition:all .15s;letter-spacing:.04em;
}
#refresh-btn:hover{border-color:var(--cyan);color:var(--cyan)}
#refresh-btn:disabled{opacity:.4;cursor:not-allowed}

/* ── Controls bar ── */
#controls{
  display:flex;align-items:center;gap:10px;
  padding:10px 24px;
  border-bottom:1px solid var(--border);
  background:rgba(5,5,10,.7);
  flex-shrink:0;
  flex-wrap:wrap;
}
.filter-label{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:.08em;margin-right:4px}
.niche-chip{
  font-family:var(--mono);font-size:11px;
  padding:5px 12px;border-radius:3px;
  border:1px solid var(--border2);
  background:transparent;color:var(--text2);
  cursor:pointer;transition:all .15s;letter-spacing:.02em;
  white-space:nowrap;
}
.niche-chip:hover{border-color:var(--border2);color:var(--text)}
.niche-chip.active{border-color:var(--red);color:var(--red);background:rgba(255,51,102,.06)}
.divider-v{width:1px;height:20px;background:var(--border2);margin:0 4px;flex-shrink:0}
.country-select{
  font-family:var(--mono);font-size:11px;
  padding:5px 10px;border-radius:3px;
  border:1px solid var(--border2);
  background:var(--surface2);color:var(--text2);
  cursor:pointer;outline:none;
}

/* ── Main grid ── */
#main{
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:1px;
  flex:1;
  background:var(--border);
  overflow:hidden;
}
.panel{
  background:var(--bg);
  display:flex;flex-direction:column;
  overflow:hidden;
  position:relative;
}
.panel-head{
  display:flex;align-items:center;gap:10px;
  padding:12px 18px;
  border-bottom:1px solid var(--border);
  background:var(--surface);
  flex-shrink:0;
}
.panel-title{
  font-family:var(--mono);font-size:11px;
  letter-spacing:.08em;color:var(--text2);
  text-transform:uppercase;
}
.panel-count{
  margin-left:auto;
  font-family:var(--mono);font-size:10px;
  color:var(--text3);
}
.panel-body{flex:1;overflow-y:auto;padding:0}
.panel-body::-webkit-scrollbar{width:3px}
.panel-body::-webkit-scrollbar-track{background:transparent}
.panel-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ── Trend cards ── */
.trend-item{
  display:flex;align-items:flex-start;gap:14px;
  padding:14px 18px;
  border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .1s;
  position:relative;
}
.trend-item:hover{background:var(--surface)}
.trend-item:last-child{border-bottom:none}

/* Heat indicator */
.heat{
  flex-shrink:0;
  width:36px;height:36px;
  border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:13px;font-weight:700;
  margin-top:2px;
}
.heat-fire{background:rgba(255,51,102,.12);color:var(--red);border:1px solid rgba(255,51,102,.2)}
.heat-hot{background:rgba(255,107,53,.12);color:var(--orange);border:1px solid rgba(255,107,53,.2)}
.heat-warm{background:rgba(255,209,102,.1);color:var(--yellow);border:1px solid rgba(255,209,102,.15)}
.heat-cool{background:rgba(0,212,255,.08);color:var(--cyan);border:1px solid rgba(0,212,255,.12)}

.trend-content{flex:1;min-width:0}
.trend-title{
  font-size:13px;font-weight:600;
  color:var(--text);line-height:1.35;
  margin-bottom:5px;
  overflow:hidden;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.trend-meta{
  display:flex;align-items:center;gap:10px;
  flex-wrap:wrap;
}
.trend-tag{
  font-family:var(--mono);font-size:10px;
  padding:2px 7px;border-radius:2px;
  border:1px solid var(--border2);
  color:var(--text3);
}
.trend-views{font-family:var(--mono);font-size:10px;color:var(--cyan)}
.trend-channel{font-family:var(--mono);font-size:10px;color:var(--text3)}
.trend-age{font-family:var(--mono);font-size:10px;color:var(--text3)}

/* Score bar on right */
.trend-score-wrap{flex-shrink:0;text-align:right}
.trend-score{
  font-family:var(--mono);font-size:20px;font-weight:700;
  line-height:1;margin-bottom:3px;
}
.trend-score-label{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.06em}

/* ── Velocity bar at bottom of card ── */
.vel-bar{
  position:absolute;bottom:0;left:0;height:2px;
  background:linear-gradient(90deg,var(--red),var(--orange));
  transition:width 1s ease;
  border-radius:0 2px 2px 0;
}

/* ── Loading skeleton ── */
.skeleton{
  background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);
  background-size:200% 100%;
  animation:shimmer 1.4s infinite;
  border-radius:3px;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-item{padding:14px 18px;border-bottom:1px solid var(--border)}
.skel-line{height:12px;margin-bottom:8px}
.skel-line-sm{height:10px;width:60%}

/* ── Empty state ── */
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;padding:32px;text-align:center;
}
.empty-state p{font-family:var(--mono);font-size:12px;color:var(--text3);line-height:1.8}

/* ── Summary row (bottom bar) ── */
#summary-bar{
  display:flex;align-items:center;gap:24px;
  padding:8px 24px;
  border-top:1px solid var(--border);
  background:rgba(5,5,10,.9);
  flex-shrink:0;
  overflow-x:auto;
}
.sum-item{display:flex;align-items:center;gap:8px;white-space:nowrap}
.sum-label{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:.06em}
.sum-value{font-family:var(--mono);font-size:11px;font-weight:700}
.sum-sep{width:1px;height:16px;background:var(--border2);flex-shrink:0}

/* ── Glow accents on panels ── */
.panel:nth-child(1) .panel-head::after{content:'YT';font-family:var(--mono);font-size:9px;color:var(--red);letter-spacing:.1em;margin-left:auto;padding-right:0}
.panel:nth-child(2) .panel-head::after{content:'YT';font-family:var(--mono);font-size:9px;color:var(--orange);letter-spacing:.1em;margin-left:auto;padding-right:0}
.panel:nth-child(3) .panel-head::after{content:'YT';font-family:var(--mono);font-size:9px;color:var(--green);letter-spacing:.1em;margin-left:auto;padding-right:0}
.panel:nth-child(4) .panel-head::after{content:'YT';font-family:var(--mono);font-size:9px;color:var(--yellow);letter-spacing:.1em;margin-left:auto;padding-right:0}

/* Error banner */
.error-banner{
  font-family:var(--mono);font-size:11px;color:var(--red);
  padding:8px 18px;background:rgba(255,51,102,.06);
  border-bottom:1px solid rgba(255,51,102,.15);
}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="logo">Trend<span class="slash">/</span><span class="radar-word">Radar</span></div>
    <div class="pulse-dot"></div>
    <span class="live-label">LIVE</span>
    <div class="header-right">
      <span id="last-update">—</span>
      <button id="refresh-btn" onclick="loadAll()">↻ REFRESH</button>
    </div>
  </header>

  <div id="controls">
    <span class="filter-label">NICHO</span>
    <div id="niche-chips"></div>
    <div class="divider-v"></div>
    <span class="filter-label">PAÍS</span>
    <select class="country-select" id="country-select" onchange="loadAll()">
      <option value="US">🇺🇸 USA</option>
      <option value="MX">🇲🇽 México</option>
      <option value="AR">🇦🇷 Argentina</option>
      <option value="CO">🇨🇴 Colombia</option>
      <option value="ES">🇪🇸 España</option>
      <option value="BR">🇧🇷 Brasil</option>
    </select>
  </div>

  <div id="main">
    <div class="panel" id="panel-breaking">
      <div class="panel-head">
        <div class="pulse-dot" style="background:var(--red);box-shadow:0 0 8px var(--red)"></div>
        <span class="panel-title">Breaking — Últimas 24h</span>
        <span class="panel-count" id="count-breaking">—</span>
      </div>
      <div class="panel-body" id="body-breaking"></div>
    </div>
    <div class="panel" id="panel-rising">
      <div class="panel-head">
        <div class="pulse-dot" style="background:var(--orange);box-shadow:0 0 8px var(--orange);animation-delay:.5s"></div>
        <span class="panel-title">Rising — Últimos 3 días</span>
        <span class="panel-count" id="count-rising">—</span>
      </div>
      <div class="panel-body" id="body-rising"></div>
    </div>
    <div class="panel" id="panel-searches">
      <div class="panel-head">
        <div class="pulse-dot" style="background:var(--green);box-shadow:0 0 8px var(--green);animation-delay:1s"></div>
        <span class="panel-title">Trending en tu país ahora</span>
        <span class="panel-count" id="count-searches">—</span>
      </div>
      <div class="panel-body" id="body-searches"></div>
    </div>
    <div class="panel" id="panel-emerging">
      <div class="panel-head">
        <div class="pulse-dot" style="background:var(--yellow);box-shadow:0 0 8px var(--yellow);animation-delay:1.5s"></div>
        <span class="panel-title">Emergentes — Próximos a explotar</span>
        <span class="panel-count" id="count-emerging">—</span>
      </div>
      <div class="panel-body" id="body-emerging"></div>
    </div>
  </div>

  <div id="summary-bar">
    <div class="sum-item"><span class="sum-label">TOTAL TENDENCIAS</span><span class="sum-value" id="sum-total" style="color:var(--cyan)">—</span></div>
    <div class="sum-sep"></div>
    <div class="sum-item"><span class="sum-label">MÁS CALIENTE</span><span class="sum-value" id="sum-hot" style="color:var(--red)">—</span></div>
    <div class="sum-sep"></div>
    <div class="sum-item"><span class="sum-label">NICHO ACTIVO</span><span class="sum-value" id="sum-niche" style="color:var(--orange)">—</span></div>
    <div class="sum-sep"></div>
    <div class="sum-item"><span class="sum-label">OPORTUNIDAD</span><span class="sum-value" id="sum-opp" style="color:var(--green)">—</span></div>
  </div>

</div>

<script>
var YT_API_KEY = 'AIzaSyDqtBO_IQaFRuffNANhrK-EBK163NXxaso';

var NICHES = [
  { id:'all',    label:'Todos',       terms:['viral','trending','2025'] },
  { id:'tech',   label:'Tecnología',  terms:['inteligencia artificial','chatgpt','tecnologia'] },
  { id:'finance',label:'Finanzas',    terms:['inversión','cripto','dinero','finanzas'] },
  { id:'fitness',label:'Fitness',     terms:['ejercicio','gym','dieta','salud'] },
  { id:'biz',    label:'Negocios',    terms:['emprendimiento','negocio','startup'] },
  { id:'entertain',label:'Entretenimiento', terms:['viral','tendencia','meme'] },
];

var activeNiche = 'all';
var allTrends = [];

// ── Render niche chips ──
function renderChips() {
  var wrap = document.getElementById('niche-chips');
  wrap.innerHTML = NICHES.map(function(n) {
    return '<button class="niche-chip'+(n.id===activeNiche?' active':'')+'" onclick="setNiche(\''+n.id+'\')">'+n.label+'</button>';
  }).join('');
}

function setNiche(id) {
  activeNiche = id;
  renderChips();
  loadAll();
}

// ── Skeleton loader ──
function showSkeleton(panelId) {
  var html = '';
  for(var i=0;i<5;i++) {
    html += '<div class="skel-item"><div class="skeleton skel-line" style="width:'+(60+Math.random()*30)+'%"></div><div class="skeleton skel-line-sm"></div></div>';
  }
  document.getElementById(panelId).innerHTML = html;
}

// ── YouTube fetch ──
async function fetchYT(terms, hoursBack, maxResults) {
  var since = new Date(Date.now() - hoursBack*60*60*1000).toISOString();
  var query = terms.join(' OR ');
  var url = 'https://www.googleapis.com/youtube/v3/search?part=snippet&q='+encodeURIComponent(query)+
    '&type=video&order=viewCount&publishedAfter='+since+
    '&maxResults='+(maxResults||10)+'&key='+YT_API_KEY;
  var r = await fetch(url);
  var d = await r.json();
  if(!d.items||!d.items.length) return [];
  var ids = d.items.map(function(i){return i.id.videoId;}).filter(Boolean).join(',');
  if(!ids) return [];
  var r2 = await fetch('https://www.googleapis.com/youtube/v3/videos?part=statistics,snippet&id='+ids+'&key='+YT_API_KEY);
  var d2 = await r2.json();
  return (d2.items||[]).map(function(v) {
    var views = parseInt(v.statistics.viewCount||0);
    var likes = parseInt(v.statistics.likeCount||0);
    var pub = new Date(v.snippet.publishedAt);
    var hoursAgo = Math.round((Date.now()-pub)/3600000);
    var velScore = Math.min(100, Math.round(Math.log10(views/Math.max(hoursAgo,1)+1)*28));
    return {
      id: v.id,
      title: v.snippet.title,
      channel: v.snippet.channelTitle,
      views: views,
      likes: likes,
      viewsFmt: views>=1e6?(views/1e6).toFixed(1)+'M':views>=1e3?(views/1e3).toFixed(0)+'K':views,
      hoursAgo: hoursAgo,
      velScore: velScore,
      url: 'https://youtube.com/watch?v='+v.id,
      niche: activeNiche,
      source: 'youtube'
    };
  }).sort(function(a,b){return b.views-a.views;});
}

// ── YouTube Trending oficial por país ──
async function fetchYTTrending(country, categoryId) {
  try {
    var url = 'https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics'+
      '&chart=mostPopular&regionCode='+country+
      '&videoCategoryId='+(categoryId||'0')+
      '&maxResults=10&key='+YT_API_KEY;
    var r = await fetch(url);
    var d = await r.json();
    if(!d.items) return [];
    return d.items.map(function(v, i) {
      var views = parseInt(v.statistics.viewCount||0);
      var pub = new Date(v.snippet.publishedAt);
      var hoursAgo = Math.round((Date.now()-pub)/3600000);
      var velScore = Math.min(100, Math.round(90 - i*7));
      return {
        id: v.id,
        title: v.snippet.title,
        channel: v.snippet.channelTitle,
        views: views,
        viewsFmt: views>=1e6?(views/1e6).toFixed(1)+'M':views>=1e3?(views/1e3).toFixed(0)+'K':views,
        hoursAgo: hoursAgo,
        velScore: velScore,
        url: 'https://youtube.com/watch?v='+v.id,
        source: 'yt-trending'
      };
    });
  } catch(e) {
    console.warn('YT Trending error:', e.message);
    return [];
  }
}

// ── Heat level ──
function heatClass(score) {
  if(score>=80) return 'heat-fire';
  if(score>=60) return 'heat-hot';
  if(score>=40) return 'heat-warm';
  return 'heat-cool';
}
function heatEmoji(score) {
  if(score>=80) return '🔥';
  if(score>=60) return '⚡';
  if(score>=40) return '📈';
  return '👀';
}
function scoreColor(score) {
  if(score>=80) return 'var(--red)';
  if(score>=60) return 'var(--orange)';
  if(score>=40) return 'var(--yellow)';
  return 'var(--cyan)';
}

// ── Render trend item ──
function renderYTItem(v) {
  var col = scoreColor(v.velScore);
  var velPct = v.velScore+'%';
  return '<div class="trend-item" onclick="window.open(\''+v.url+'\',\'_blank\')">' +
    '<div class="heat '+heatClass(v.velScore)+'">'+heatEmoji(v.velScore)+'</div>' +
    '<div class="trend-content">' +
      '<div class="trend-title">'+escHtml(v.title)+'</div>' +
      '<div class="trend-meta">' +
        '<span class="trend-views">'+v.viewsFmt+' views</span>' +
        '<span class="trend-channel">'+escHtml(v.channel)+'</span>' +
        '<span class="trend-age">'+v.hoursAgo+'h ago</span>' +
      '</div>' +
    '</div>' +
    '<div class="trend-score-wrap">' +
      '<div class="trend-score" style="color:'+col+'">'+v.velScore+'</div>' +
      '<div class="trend-score-label">VELOCITY</div>' +
    '</div>' +
    '<div class="vel-bar" style="width:'+velPct+'"></div>' +
  '</div>';
}

function renderGTItem(t, i) {
  var col = scoreColor(t.velScore);
  var article = t.articles && t.articles[0] ? t.articles[0] : null;
  return '<div class="trend-item" onclick="window.open(\''+t.url+'\',\'_blank\')">' +
    '<div class="heat '+heatClass(t.velScore)+'">'+heatEmoji(t.velScore)+'</div>' +
    '<div class="trend-content">' +
      '<div class="trend-title">'+escHtml(t.title)+'</div>' +
      '<div class="trend-meta">' +
        '<span class="trend-views">'+t.traffic+' búsquedas</span>' +
        (article ? '<span class="trend-channel">'+escHtml(article.source||'')+'</span>' : '') +
        '<span class="trend-tag">Google Trends</span>' +
      '</div>' +
    '</div>' +
    '<div class="trend-score-wrap">' +
      '<div class="trend-score" style="color:'+col+'">'+t.velScore+'</div>' +
      '<div class="trend-score-label">HEAT</div>' +
    '</div>' +
    '<div class="vel-bar" style="width:'+t.velScore+'%"></div>' +
  '</div>';
}

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Update summary bar ──
function updateSummary(breaking, rising, searches, emerging) {
  var total = breaking.length + rising.length + searches.length + emerging.length;
  document.getElementById('sum-total').textContent = total;
  var hottest = [...breaking,...rising].sort(function(a,b){return b.velScore-a.velScore;})[0];
  document.getElementById('sum-hot').textContent = hottest ? escHtml(hottest.title.substring(0,30))+'...' : '—';
  var nicheLabel = NICHES.find(function(n){return n.id===activeNiche;});
  document.getElementById('sum-niche').textContent = nicheLabel ? nicheLabel.label : '—';
  var opp = emerging.length > 0 ? emerging[0] : (searches.length > 0 ? searches[0] : null);
  document.getElementById('sum-opp').textContent = opp ? escHtml((opp.title||'').substring(0,28))+'...' : '—';
  document.getElementById('last-update').textContent = 'UPDATED '+new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});
}

// ── Main load ──
async function loadAll() {
  var btn = document.getElementById('refresh-btn');
  btn.disabled = true;
  btn.textContent = '↻ LOADING...';

  var niche = NICHES.find(function(n){return n.id===activeNiche;}) || NICHES[0];
  var country = document.getElementById('country-select').value;

  ['body-breaking','body-rising','body-searches','body-emerging'].forEach(showSkeleton);
  ['count-breaking','count-rising','count-searches','count-emerging'].forEach(function(id){
    document.getElementById(id).textContent='—';
  });

  try {
    // Fetch en paralelo — todo YouTube, sin Google Trends
    var [breaking, rising, trending, trendingEnt] = await Promise.all([
      fetchYT(niche.terms, 24, 8).catch(function(){return [];}),
      fetchYT(niche.terms, 72, 8).catch(function(){return [];}),
      fetchYTTrending(country, '0').catch(function(){return [];}),   // Trending general
      fetchYTTrending(country, '24').catch(function(){return [];})   // Trending entretenimiento
    ]);

    // Emerging: videos con alto velocity pero pocos views aún (oportunidad temprana)
    var allFound = [...breaking, ...rising];
    var emerging = allFound
      .filter(function(v){ return v.views < 150000 && v.velScore >= 35; })
      .sort(function(a,b){ return b.velScore - a.views/100000; })
      .slice(0, 8);

    // Panel de búsquedas = trending oficial del país
    var searches = trending.length ? trending : trendingEnt;

    // Render panels
    document.getElementById('body-breaking').innerHTML =
      breaking.length ? breaking.map(renderYTItem).join('') : emptyState('Sin resultados para este nicho en 24h — prueba "Todos"');
    document.getElementById('body-rising').innerHTML =
      rising.length ? rising.map(renderYTItem).join('') : emptyState('Sin videos en las últimas 72h');
    document.getElementById('body-searches').innerHTML =
      searches.length ? searches.map(renderYTItem).join('') : emptyState('No se pudo cargar trending del país');
    document.getElementById('body-emerging').innerHTML =
      emerging.length ? emerging.map(renderYTItem).join('') :
        emptyState('No hay emergentes detectados — estos son videos con poco views pero crecimiento rápido');

    // Counts
    document.getElementById('count-breaking').textContent = breaking.length+' items';
    document.getElementById('count-rising').textContent = rising.length+' items';
    document.getElementById('count-searches').textContent = searches.length+' items';
    document.getElementById('count-emerging').textContent = emerging.length+' items';

    updateSummary(breaking, rising, searches, emerging);

  } catch(e) {
    console.error(e);
    ['body-breaking','body-rising','body-searches','body-emerging'].forEach(function(id){
      document.getElementById(id).innerHTML = '<div class="error-banner">Error: '+e.message+'</div>';
    });
  }

  btn.disabled = false;
  btn.textContent = '↻ REFRESH';

  // Auto-refresh cada 10 min
  clearTimeout(window._autoRefresh);
  window._autoRefresh = setTimeout(loadAll, 10*60*1000);
}

function emptyState(msg) {
  return '<div class="empty-state"><p>'+msg+'</p></div>';
}

// ── Init ──
renderChips();
loadAll();
</script>
</body>
